<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Padhai Saathi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/gsap.min.js"></script>
  <link rel="manifest" href="/manifest.json">
</head>
<body class="font-['Poppins'] bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen">
<header class="bg-white shadow-lg p-4 flex items-center space-x-3">
  <img src="/static/img/logo.png" alt="Logo" class="h-10">
  <h1 class="text-2xl font-bold text-indigo-600">Padhai Saathi</h1>
</header>
<main class="container mx-auto p-6">
  {% block content %}{% endblock %}
</main>

<script>
  gsap.from("header", {y: -50, opacity: 0, duration: 1});
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
